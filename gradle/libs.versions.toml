navigationCompose = "2.8.0-alpha10"
google-gms = "4.5.0"
firebase-bom = "33.8.0"
credentials = "1.3.0"
# GitLive Firebase KMP wrapper. Pinned to 2.1.0: it is built with Kotlin 2.0.20
# metadata (readable by this project's Kotlin 2.1.0 compiler). 2.2.0+ are built
# with Kotlin 2.2 and their klibs cannot be consumed by Kotlin 2.1.0.
gitlive-firebase = "2.1.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
